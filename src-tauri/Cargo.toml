[package]
name = "sortedview"
version = "0.1.0"
description = "Metadata tabanli foto/video yoneticisi"
authors = ["Efe"]
edition = "2021"

[lib]
name = "sortedview_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Paralel tarama
walkdir = "2"
rayon = "1"

# Metadata (foto EXIF + video mp4/mov) — SADECE OKUMA
nom-exif = "3"
little_exif = "0.6.23"

# Thumbnail uretimi
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp", "bmp", "tiff"] }

# SQLite metadata index (medya kopyalanmaz, sadece metadata saklanir)
rusqlite = { version = "0.32", features = ["bundled"] }

# Cevrimdisi ters cografi kodlama (GPS -> yer adi). GeoNames verisi gomulu.
reverse_geocoder = "4"

# Yardimcilar
anyhow = "1"
thiserror = "2"
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
once_cell = "1"
num_cpus = "1"
uuid = { version = "1", features = ["v4"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_System_Ole", "Win32_UI_Shell"] }
tauri-plugin-drag = "2.1.1"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true
panic = "abort"
