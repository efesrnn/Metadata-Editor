[package]
name = "meta-gallery"
version = "0.1.0"
description = "Metadata tabanli foto/video yoneticisi"
authors = ["Efe"]
edition = "2021"

[lib]
name = "meta_gallery_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Paralel tarama
walkdir = "2"
rayon = "1"

# Metadata (foto EXIF + video mp4/mov) — SADECE OKUMA
nom-exif = "3"

# Thumbnail uretimi
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp", "bmp", "tiff"] }

# SQLite metadata index (medya kopyalanmaz, sadece metadata saklanir)
rusqlite = { version = "0.32", features = ["bundled"] }

# Yardimcilar
anyhow = "1"
thiserror = "2"
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
once_cell = "1"
num_cpus = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true
panic = "abort"
